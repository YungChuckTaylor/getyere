apply plugin: 'com.android.application'

android {
    namespace = "com.getyere.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.getyere.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Missing Firebase configuration must never silently produce a store release.
// The client file remains ignored; CI installs it from GOOGLE_SERVICES_JSON_B64.
def servicesJSON = file('google-services.json')
if (servicesJSON.isFile()) {
    apply plugin: 'com.google.gms.google-services'
}

def verifyReleasePushConfiguration = tasks.register('verifyReleasePushConfiguration') {
    doLast {
        if (!servicesJSON.isFile()) {
            throw new GradleException('Release blocked: android/app/google-services.json is missing. Install the Firebase Android CLIENT config from GOOGLE_SERVICES_JSON_B64; never use a service-account key.')
        }
        def data
        try {
            data = new groovy.json.JsonSlurper().parse(servicesJSON)
        } catch (Exception ignored) {
            throw new GradleException('Release blocked: invalid Firebase Android client JSON. Run scripts/validate-google-services.mjs before building.')
        }
        def client = data.client?.find { it.client_info?.android_client_info?.package_name == android.defaultConfig.applicationId }
        def number = data.project_info?.project_number?.toString()
        def appId = client?.client_info?.mobilesdk_app_id
        if (data.type == 'service_account' || data.private_key || data.private_key_id || data.client_email
            || !(data.project_info?.project_id instanceof String) || !data.project_info.project_id.trim()
            || !number || !(number ==~ /[0-9]+/)
            || !appId || !(appId ==~ /1:[0-9]+:android:[a-fA-F0-9]+/)
            || appId.split(':')[1] != number
            || !client?.api_key?.any { it.current_key?.trim() }) {
            throw new GradleException('Release blocked: incomplete or wrong-package Firebase Android client config. Run scripts/validate-google-services.mjs; project number, mobile app ID and client API key must match com.getyere.app.')
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild' || task.name ==~ /pre.+ReleaseBuild/) {
        task.dependsOn(verifyReleasePushConfiguration)
    }
}
