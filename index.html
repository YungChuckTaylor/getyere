<script>
/* ============================================================
   Yere — client-side reminder OS
   ============================================================ */
const WEEKDAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const WEEKDAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DEFAULT_HOUR = 9, DEFAULT_MIN = 0;
const US_HOLIDAYS = [ /* mm-dd plus computed */
  '01-01','07-04','12-25','12-24','11-11','06-19'
];

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const now = () => new Date();
const pad = n => String(n).padStart(2,'0');
const clone = o => JSON.parse(JSON.stringify(o));

function hashCode(str) {
  let h = 5381;
  for (let i=0;i<str.length;i++) h = ((h<<5)+h) ^ str.charCodeAt(i);
  return ('00000000'+(h>>>0).toString(16)).slice(-8) + btoa(unescape(encodeURIComponent(str))).slice(0,16);
}

function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function nthWeekdayOfMonth(year, month, weekday, n) {
  if (n === -1) {
    const last = new Date(year, month+1, 0);
    const diff = (last.getDay() - weekday + 7) % 7;
    last.setDate(last.getDate() - diff);
    return last;
  }
  const first = new Date(year, month, 1);
  const diff = (weekday - first.getDay() + 7) % 7;
  const day = 1 + diff + (n-1)*7;
  const dt = new Date(year, month, day);
  if (dt.getMonth() !== month) return null;
  return dt;
}
function lastDayOfMonth(y,m){ return new Date(y, m+1, 0); }
function thanksgiving(year){ return nthWeekdayOfMonth(year, 10, 4, 4); }
function laborDay(year){ return nthWeekdayOfMonth(year, 8, 1, 1); }
function memorialDay(year){ return nthWeekdayOfMonth(year, 4, 1, -1); }
function isHoliday(d) {
  const md = pad(d.getMonth()+1)+'-'+pad(d.getDate());
  if (US_HOLIDAYS.includes(md)) return true;
  const y = d.getFullYear();
  const list = [thanksgiving(y), laborDay(y), memorialDay(y)];
  return list.some(h => h && isSameDay(h,d));
}
function isWeekend(d){ const x=d.getDay(); return x===0||x===6; }

function applySkips(date, rec) {
  if (!rec) return date;
  let d = new Date(date);
  let guard = 0;
  while (guard++ < 30) {
    const skipW = rec.skipWeekends && isWeekend(d);
    const skipH = rec.skipHolidays && isHoliday(d);
    if (!skipW && !skipH) break;
    d = addDays(d, 1);
  }
  return d;
}

/* ---------- Natural language parser ---------- */
function parseTimeToken(s) {
  s = s.toLowerCase().trim();
  let m = s.match(/^(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?$/i);
  if (!m) return null;
  let h = +m[1], min = m[2] ? +m[2] : 0;
  const ap = (m[3]||'').replace(/\./g,'').toLowerCase();
  if (ap === 'pm' && h < 12) h += 12;
  if (ap === 'am' && h === 12) h = 0;
  if (!ap && h <= 7 && s.indexOf(':') === -1) { /* bare 1-7 often pm in reminders? keep as-is if >= 8 morning */ }
  if (h > 23 || min > 59) return null;
  return { h, m: min };
}

function parseNaturalLanguage(raw) {
  let text = (raw||'').trim();
  const original = text;
  const result = {
    title: text,
    date: null,
    time: null,
    recurrence: null,
    confidence: 0,
    consumed: []
  };
  if (!text) return result;

  const consume = (re, label) => {
    const m = text.match(re);
    if (!m) return null;
    result.consumed.push({ label, match: m[0] });
    text = (text.slice(0, m.index) + ' ' + text.slice(m.index + m[0].length)).replace(/\s+/g,' ').trim();
    result.confidence += 1;
    return m;
  };

  // Recurrence: every N units
  let m;
  m = consume(/\bevery\s+(\d+)\s+(minutes?|mins?|hours?|hrs?|days?|weeks?|months?|years?)\b/i, 'interval');
  if (m) {
    const n = +m[1];
    const u = m[2].toLowerCase();
    const unit = u.startsWith('min') ? 'minutes' : u.startsWith('hour')||u.startsWith('hr') ? 'hours' : u.startsWith('day') ? 'days' : u.startsWith('week') ? 'weeks' : u.startsWith('month') ? 'months' : 'years';
    result.recurrence = { type:'interval', interval:{value:n, unit}, end:{type:'never'}, adaptive:'original', skipWeekends:false, skipHolidays:false, completedCount:0 };
  }
  if (!result.recurrence) {
    m = consume(/\bevery\s+(weekday|workday|day|week|month|year|morning|evening)\b/i, 'preset');
    if (m) {
      const k = m[1].toLowerCase();
      if (k==='day'||k==='morning'||k==='evening') result.recurrence = { type:'interval', interval:{value:1,unit:'days'}, end:{type:'never'}, adaptive:'original', skipWeekends:false, skipHolidays:false, completedCount:0 };
      else if (k==='weekday'||k==='workday') result.recurrence = { type:'interval', interval:{value:1,unit:'days'}, end:{type:'never'}, adaptive:'original', skipWeekends:true, skipHolidays:false, completedCount:0 };
      else if (k==='week') result.recurrence = { type:'interval', interval:{value:1,unit:'weeks'}, end:{type:'never'}, adaptive:'original', skipWeekends:false, skipHolidays:false, completedCount:0 };
      else if (k==='month') result.recurrence = { type:'interval', interval:{value:1,unit:'months'}, end:{type:'never'}, adaptive:'original', skipWeekends:false, skipHolidays:false, completedCount:0 };
      else result.recurrence = { type:'interval', interval:{value:1,unit:'years'}, end:{type:'never'}, adaptive:'original', skipWeekends:false, skipHolidays:false, completedCount:0 };
    }
  }
  if (!result.recurrence) {
    m = consume(/\bevery\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)s?\b/i, 'weekly-dow');
    if (m) {
      result.recurrence = { type:'interval', interval:{value:1,unit:'weeks'}, weekday: WEEKDAYS.indexOf(m[1].toLowerCase()), end:{type:'never'}, adaptive:'original', skipWeekends:false, skipHolidays:false, completedCount:0 };
    }
  }
  // Calendar-aware
  m = consume(/\b(first|last)\s+day\s+of\s+(every\s+)?(the\s+)?month\b/i, 'cal-day');
  if (m) {
    result.recurrence = { type:'calendar', calendar:{ pattern: m[1].toLowerCase()==='first' ? 'first-day' : 'last-day' }, end:{type:'never'}, adaptive:'original', skipWeekends:false, skipHolidays:false, completedCount:0 };
  }
  m = consume(/\b(first|second|third|fourth|last|1st|2nd|3rd|4th)\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\s+of\s+(every\s+)?(the\s+)?month\b/i, 'nth-weekday');
  if (m) {
    const map = {first:1,second:2,third:3,fourth:4,last:-1,'1st':1,'2nd':2,'3rd':3,'4th':4};
    result.recurrence = { type:'calendar', calendar:{ pattern:'nth-weekday', n: map[m[1].toLowerCase()], weekday: WEEKDAYS.indexOf(m[2].toLowerCase()) }, end:{type:'never'}, adaptive:'original', skipWeekends:false, skipHolidays:false, completedCount:0 };
  }
  m = consume(/\bon\s+the\s+(\d{1,2})(st|nd|rd|th)?(\s+of\s+(every\s+)?month)?\b/i, 'dom');
  if (m && /month/i.test(m[0])) {
    result.recurrence = { type:'calendar', calendar:{ pattern:'nth-day', n:+m[1] }, end:{type:'never'}, adaptive:'original', skipWeekends:false, skipHolidays:false, completedCount:0 };
  }

  // Relative "in X"
  m = consume(/\bin\s+(\d+)\s+(minutes?|mins?|hours?|hrs?|days?|weeks?|months?|years?)\b/i, 'in');
  if (m) {
    const n=+m[1]; const u=m[2].toLowerCase();
    const d = new Date();
    if (u.startsWith('min')) d.setMinutes(d.getMinutes()+n);
    else if (u.startsWith('hour')||u.startsWith('hr')) d.setHours(d.getHours()+n);
    else if (u.startsWith('day')) d.setDate(d.getDate()+n);
    else if (u.startsWith('week')) d.setDate(d.getDate()+n*7);
    else if (u.startsWith('month')) d.setMonth(d.getMonth()+n);
    else d.setFullYear(d.getFullYear()+n);
    result.date = d;
    result.time = { h:d.getHours(), m:d.getMinutes() };
  }

  // Time of day words
  m = consume(/\b(at\s+)?(noon|midnight|morning|afternoon|evening|tonight|night)\b/i, 'tod');
  if (m && !result.time) {
    const k=m[2].toLowerCase();
    if (k==='noon') result.time={h:12,m:0};
    else if (k==='midnight') result.time={h:0,m:0};
    else if (k==='morning') result.time={h:9,m:0};
    else if (k==='afternoon') result.time={h:14,m:0};
    else result.time={h:19,m:0};
    if ((k==='tonight'||k==='night'||k==='evening'||k==='afternoon'||k==='morning') && !result.date) result.date = new Date();
  }

  // Explicit time
  m = consume(/\b(?:at\s+)?(\d{1,2}(?::\d{2})?\s*(?:a\.?m\.?|p\.?m\.?)?)\b/i, 'time');
  if (m) {
    const t = parseTimeToken(m[1]);
    if (t) result.time = t;
    else { /* restore if false positive */
      text = (m[0] + ' ' + text).trim();
    }
  }

  // today / tomorrow / tonight already / yesterday
  m = consume(/\b(today|tomorrow|yesterday)\b/i, 'rel-day');
  if (m) {
    const k=m[1].toLowerCase();
    const d=new Date();
    if (k==='tomorrow') d.setDate(d.getDate()+1);
    if (k==='yesterday') d.setDate(d.getDate()-1);
    result.date = startOfDay(d);
  }

  // next week / next month
  m = consume(/\bnext\s+(week|month|year)\b/i, 'next-unit');
  if (m) {
    const d=new Date(); const k=m[1].toLowerCase();
    if (k==='week') d.setDate(d.getDate()+7);
    else if (k==='month') d.setMonth(d.getMonth()+1);
    else d.setFullYear(d.getFullYear()+1);
    result.date = startOfDay(d);
  }

  // next weekday or this weekday
  m = consume(/\b(next|this)?\s*(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i, 'dow');
  if (m) {
    const wd = WEEKDAYS.indexOf(m[2].toLowerCase());
    const d = new Date();
    let diff = wd - d.getDay();
    if (diff < 0 || (diff===0 && (m[1]||'').toLowerCase()==='next')) diff += 7;
    if ((m[1]||'').toLowerCase()==='next' && diff===0) diff = 7;
    if (diff===0 && d.getHours() >= (result.time?result.time.h:DEFAULT_HOUR)) diff = 7;
    d.setDate(d.getDate()+diff);
    result.date = startOfDay(d);
  }

  // Month day (December 25, Dec 25th, 25 Dec)
  m = consume(/\b(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)\s+(\d{1,2})(?:st|nd|rd|th)?(?:\s*,?\s*(\d{4}))?\b/i, 'md');
  if (m) {
    let mon = m[1].toLowerCase();
    if (mon==='sept') mon='sep';
    let mi = MONTHS.indexOf(mon);
    if (mi<0) mi = MONTHS_SHORT.map(x=>x.toLowerCase()).indexOf(mon);
    const day = +m[2];
    let year = m[3] ? +m[3] : new Date().getFullYear();
    let d = new Date(year, mi, day);
    if (d < startOfDay(new Date()) && !m[3]) d = new Date(year+1, mi, day);
    result.date = startOfDay(d);
  }
  m = consume(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|oct|nov|dec)(?:\s*,?\s*(\d{4}))?\b/i, 'dm');
  if (m) {
    let mon=m[2].toLowerCase();
    let mi = MONTHS.indexOf(mon); if (mi<0) mi = MONTHS_SHORT.map(x=>x.toLowerCase()).indexOf(mon);
    const day=+m[1]; let year=m[3]?+m[3]:new Date().getFullYear();
    let d=new Date(year,mi,day);
    if (d < startOfDay(new Date()) && !m[3]) d=new Date(year+1,mi,day);
    result.date = startOfDay(d);
  }
  m = consume(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/, 'slash');
  if (m) {
    const mo=+m[1]-1, day=+m[2];
    let year = m[3] ? (+m[3] < 100 ? 2000+ +m[3] : +m[3]) : new Date().getFullYear();
    let d=new Date(year,mo,day);
    if (d < startOfDay(new Date()) && !m[3]) d=new Date(year+1,mo,day);
    result.date = startOfDay(d);
  }

  // Clean title leftovers
  let title = text.replace(/^(remind me to|remind me|remember to|don't forget to|dont forget to|please)\s+/i,'').replace(/\s+(please)$/i,'');
  title = title.replace(/^[\s,.\-:;]+|[\s,.\-:;]+$/g,'').replace(/\s+/g,' ');
  if (!title) title = original;
  result.title = title.charAt(0).toUpperCase() + title.slice(1);

  // Defaults
  const defH = (state.settings && state.settings.defaultHour != null) ? state.settings.defaultHour : DEFAULT_HOUR;
  const defM = (state.settings && state.settings.defaultMin != null) ? state.settings.defaultMin : DEFAULT_MIN;
  if (!result.time) result.time = { h: defH, m: defM };
  if (!result.date) {
    const d = new Date();
    const candidate = new Date();
    candidate.setHours(result.time.h, result.time.m, 0, 0);
    if (candidate <= d) d.setDate(d.getDate()+1);
    result.date = startOfDay(d);
  }

  // If recurrence weekly with weekday, align date
  if (result.recurrence && result.recurrence.weekday != null) {
    const d = new Date(result.date);
    let diff = result.recurrence.weekday - d.getDay();
    if (diff < 0) diff += 7;
    d.setDate(d.getDate()+diff);
    result.date = startOfDay(d);
  }
  if (result.recurrence && result.recurrence.type==='calendar') {
    result.date = startOfDay(nextCalendarDate(result.recurrence, new Date(), result.time));
  }

  return result;
}

function combineDateTime(date, time) {
  const d = new Date(date);
  d.setHours(time.h, time.m, 0, 0);
  return d;
}

function nextCalendarDate(rec, from, time) {
  let y = from.getFullYear(), m = from.getMonth();
  const after = from;
  for (let i=0;i<24;i++) {
    let d = null;
    const cal = rec.calendar;
    if (cal.pattern==='first-day') d = new Date(y,m,1);
    else if (cal.pattern==='last-day') d = lastDayOfMonth(y,m);
    else if (cal.pattern==='nth-day') d = new Date(y,m, Math.min(cal.n, lastDayOfMonth(y,m).getDate()));
    else if (cal.pattern==='nth-weekday') d = nthWeekdayOfMonth(y,m,cal.weekday,cal.n);
    if (d) {
      d.setHours(time?time.h:DEFAULT_HOUR, time?time.m:0, 0, 0);
      d = applySkips(d, rec);
      if (d > after) return d;
    }
    m++; if (m>11){ m=0; y++; }
  }
  return addDays(from, 30);
}

function nextOccurrence(rem, fromDate, basedOnCompletion) {
  const rec = rem.recurrence;
  if (!rec || rec.type==='none') return null;
  const base = basedOnCompletion && rec.adaptive==='completion' && rem.completedAt
    ? new Date(rem.completedAt)
    : new Date(rem.due);
  let next;
  if (rec.type==='interval') {
    next = new Date(base);
    const n = rec.interval.value, u = rec.interval.unit;
    if (u==='minutes') next.setMinutes(next.getMinutes()+n);
    else if (u==='hours') next.setHours(next.getHours()+n);
    else if (u==='days') next.setDate(next.getDate()+n);
    else if (u==='weeks') next.setDate(next.getDate()+n*7);
    else if (u==='months') next.setMonth(next.getMonth()+n);
    else if (u==='years') next.setFullYear(next.getFullYear()+n);
    if (rec.weekday != null) {
      let diff = rec.weekday - next.getDay();
      if (diff < 0) diff += 7;
      next.setDate(next.getDate()+diff);
    }
  } else if (rec.type==='calendar') {
    const t = { h: new Date(rem.due).getHours(), m: new Date(rem.due).getMinutes() };
    next = nextCalendarDate(rec, new Date(Math.max(base.getTime()+1000, Date.now())), t);
  }
  if (!next) return null;
  next = applySkips(next, rec);
  if (rec.end && rec.end.type==='on' && rec.end.date && next > new Date(rec.end.date)) return null;
  if (rec.end && rec.end.type==='after' && (rec.completedCount||0) + 1 >= rec.end.count) return null;
  return next;
}

function recLabel(rec) {
  if (!rec || rec.type==='none') return '';
  if (rec.type==='interval') {
    const n = rec.interval.value, u = rec.interval.unit;
    let s = n===1 ? u.replace(/s$/,'') : (n+' '+u);
    if (rec.weekday != null) s = 'every ' + WEEKDAYS[rec.weekday];
    else s = 'every ' + (n===1 ? u.replace(/s$/,'') : n+' '+u);
    if (rec.skipWeekends) s += ' · skip weekends';
    return s;
  }
  const c = rec.calendar;
  if (c.pattern==='first-day') return 'first day of month';
  if (c.pattern==='last-day') return 'last day of month';
  if (c.pattern==='nth-day') return 'day '+c.n+' of month';
  if (c.pattern==='nth-weekday') {
    const ord = c.n===-1 ? 'last' : ['','first','second','third','fourth'][c.n];
    return ord+' '+WEEKDAYS[c.weekday]+' of month';
  }
  return 'custom';
}

function formatDue(iso) {
  const d = new Date(iso);
  const t = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  const today = startOfDay(now());
  const day = startOfDay(d);
  const diff = Math.round((day - today)/86400000);
  let dayLabel;
  if (diff===0) dayLabel='Today';
  else if (diff===1) dayLabel='Tomorrow';
  else if (diff===-1) dayLabel='Yesterday';
  else if (diff>1 && diff<7) dayLabel = WEEKDAYS_SHORT[d.getDay()];
  else dayLabel = MONTHS_SHORT[d.getMonth()]+' '+d.getDate();
  return { dayLabel, t, diff, overdue: d < now() };
}

function greeting() {
  const h = now().getHours();
  if (h < 5) return 'Working late';
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
}

    upcoming: ['Upcoming', 'Everything on the horizon, grouped by day.'],
    recurring: ['Recurring', 'Adaptive schedules, calendar-aware patterns, smart skips.'],
    completed: ['Completed', 'Finished work. Recurring items roll forward automatically.'],
    pending: ['Needs approval', 'Reminders proposed by trusted contacts.'],
    contacts: ['Trusted contacts', 'Single-use invite codes. You stay in control.'],
    audit: ['Audit log', 'Every invite, approval, reminder-from-other, and revocation.'],
    insights: ['Pattern insights', 'Yere learns how you actually complete work.'],
    settings: ['Settings', 'Defaults, holidays, security posture.']
  };
  const tt = titles[view] || titles.today;
  document.getElementById('viewTitle').textContent = tt[0];
  document.getElementById('viewSub').textContent = tt[1];
  document.getElementById('quickAddSection').classList.toggle('hidden', ['contacts','audit','settings','insights'].includes(view));

  const todayN = state.reminders.filter(r => !r.completed && r.approved!==false && isSameDay(new Date(r.due), now()) || (!r.completed && r.approved!==false && new Date(r.due) < startOfDay(now()))).length;
  document.getElementById('todayCount').textContent = todayN;
  const pend = state.reminders.filter(r => r.requiresApproval && !r.approved && !r.rejected).length;
  const pc = document.getElementById('pendingCount');
  pc.textContent = pend; pc.classList.toggle('hidden', pend===0);

  const root = document.getElementById('content');
  if (view==='contacts') { root.innerHTML = renderContacts(); return; }
  if (view==='audit') { root.innerHTML = renderAudit(); return; }
  if (view==='settings') { root.innerHTML = renderSettings(); return; }
  if (view==='insights') { root.innerHTML = renderInsights(); return; }

  let items = filteredReminders();
  if (view==='today') {
    items = items.filter(r => r.approved!==false && !r.rejected && (!r.completed || (r.completed && isSameDay(new Date(r.completedAt||r.due), now()))) && (isSameDay(new Date(r.due), now()) || (!r.completed && new Date(r.due) < startOfDay(now()))));
    items.sort((a,b)=> new Date(a.due)-new Date(b.due));
    root.innerHTML = renderGrouped(items, true);
  } else if (view==='upcoming') {
    items = items.filter(r => !r.completed && r.approved!==false && new Date(r.due) >= startOfDay(now()));
    items.sort((a,b)=> new Date(a.due)-new Date(b.due));
    root.innerHTML = renderByDay(items);
  } else if (view==='recurring') {
    items = items.filter(r => r.recurrence && r.recurrence.type && r.recurrence.type!=='none' && !r.rejected);
    items.sort((a,b)=> new Date(a.due)-new Date(b.due));
    root.innerHTML = renderList(items);
  } else if (view==='completed') {
    items = items.filter(r => r.completed);
    items.sort((a,b)=> new Date(b.completedAt||b.due)-new Date(a.completedAt||a.due));
    root.innerHTML = renderList(items);
  } else if (view==='pending') {
    items = items.filter(r => r.requiresApproval && !r.approved && !r.rejected);
    root.innerHTML = renderPending(items);
  }
}

function emptyState(title, sub) {
  return `<div class="text-center py-16 px-6">
    <div class="mx-auto h-16 w-16 rounded-3xl bg-indigo-50 dark:bg-indigo-500/10 grid place-items-center mb-4">
      <svg width="28" height="28" fill="none" stroke="#6366f1" stroke-width="1.8"><circle cx="14" cy="14" r="10"/><path d="M14 8v6l3 2"/></svg>
    </div>
    <h3 class="font-bold text-lg">${esc(title)}</h3>
    <p class="text-slate-500 text-sm mt-1 max-w-sm mx-auto">${esc(sub)}</p>
  </div>`;
}

function renderGrouped(items, splitOverdue) {
  if (!items.length) return emptyState('Inbox zero for today', 'Type above or tap the mic. “Tomorrow at 9” just works.');
  const overdue = splitOverdue ? items.filter(r => !r.completed && new Date(r.due) < startOfDay(now())) : [];
  const rest = splitOverdue ? items.filter(r => !overdue.includes(r)) : items;
  const buckets = { Morning:[], Afternoon:[], Evening:[] };
  rest.forEach(r => {
    const h = new Date(r.due).getHours();
    if (h < 12) buckets.Morning.push(r);
    else if (h < 17) buckets.Afternoon.push(r);
    else buckets.Evening.push(r);
  });
  let html = '';
  if (overdue.length) {
    html += `<div class="mb-6"><div class="flex items-center gap-2 mb-2"><span class="text-xs font-bold uppercase tracking-wider text-rose-500">Overdue</span><span class="h-px flex-1 bg-rose-200 dark:bg-rose-900/50"></span></div>${overdue.map((r,i)=>reminderCard(r,i)).join('')}</div>`;
  }
  for (const [name, arr] of Object.entries(buckets)) {
    if (!arr.length) continue;
    html += `<div class="mb-6"><div class="flex items-center gap-2 mb-2"><span class="text-xs font-bold uppercase tracking-wider text-slate-400">${name}</span><span class="h-px flex-1 bg-slate-200 dark:bg-white/10"></span></div>${arr.map((r,i)=>reminderCard(r,i)).join('')}</div>`;
  }
  return html || emptyState('All clear', 'Nothing left on today’s board.');
}

function renderByDay(items) {
  if (!items.length) return emptyState('Nothing upcoming', 'Add a reminder with a date and it will land here.');
  const groups = {};
  items.forEach(r => {
    const d = startOfDay(new Date(r.due)).toISOString();
    (groups[d] = groups[d]||[]).push(r);
  });
  return Object.keys(groups).sort().map(k => {
    const d = new Date(k);
    const f = formatDue(groups[k][0].due);
    const label = f.diff===0 ? 'Today' : f.diff===1 ? 'Tomorrow' : WEEKDAYS_SHORT[d.getDay()] + ', ' + MONTHS_SHORT[d.getMonth()] + ' ' + d.getDate();
    return `<div class="mb-6"><div class="flex items-center gap-2 mb-2"><span class="text-xs font-bold uppercase tracking-wider text-slate-400">${label}</span><span class="h-px flex-1 bg-slate-200 dark:bg-white/10"></span></div>${groups[k].map((r,i)=>reminderCard(r,i)).join('')}</div>`;
  }).join('');
}

function renderList(items) {
  if (!items.length) return emptyState('Nothing here yet', 'Try a different filter, or capture something new.');
  return `<div class="space-y-0">${items.map((r,i)=>reminderCard(r,i)).join('')}</div>`;
}

function reminderCard(r, i) {
  const f = formatDue(r.due);
  const rec = recLabel(r.recurrence);
  const overdue = !r.completed && new Date(r.due) < now();
  return `<article class="card-row anim-rise bg-white dark:bg-ink-900 rounded-2xl border border-slate-200/80 dark:border-white/5 shadow-sm mb-2 p-3.5 flex gap-3 ${overdue && !r.completed ? 'overdue-pulse' : ''}" style="animation-delay:${Math.min(i,8)*40}ms">
    <input type="checkbox" class="pretty mt-1" ${r.completed?'checked':''} onchange="toggleComplete('${r.id}')" ${r.approved===false?'disabled':''}>
    <div class="min-w-0 flex-1 cursor-pointer" onclick="openDetail('${r.id}')">
      <div class="flex items-start gap-2">
        <h3 class="font-semibold text-[15px] leading-snug ${r.completed?'line-through text-slate-400':''}">${esc(r.title)}</h3>
      </div>
      <div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-slate-500 dark:text-slate-400">
        <span class="${overdue && !r.completed ? 'text-rose-500 font-semibold' : ''}">${f.dayLabel} · ${f.t}</span>
        ${rec ? `<span class="text-indigo-500">↻ ${esc(rec)}</span>` : ''}
        ${r.fromContact ? `<span class="badge-from text-[10px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded-md text-indigo-700 dark:text-indigo-200">From ${esc(r.fromContact.name)}</span>` : ''}
      </div>
      ${r.notes ? `<p class="mt-1.5 text-[13px] text-slate-600 dark:text-slate-300 line-clamp-2">${esc(r.notes)}</p>` : ''}
      ${r.link ? `<a href="${esc(r.link)}" target="_blank" rel="noopener" class="mt-1 inline-flex items-center gap-1 text-[12px] text-indigo-600 dark:text-indigo-300 hover:underline" onclick="event.stopPropagation()"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7l5-5M7 2h4v4M10 8v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2h4"/></svg>${esc(prettyUrl(r.link))}</a>` : ''}
    </div>
    <button class="self-start p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-ink-800 text-slate-400" onclick="openDetail('${r.id}')" aria-label="Open">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4l5 4-5 4"/></svg>
    </button>
  </article>`;
}

function renderPending(items) {
  if (!items.length) return emptyState('No pending proposals', 'When a contact’s mode is “require approval”, their reminders land here.');
  return items.map((r,i) => {
    const f = formatDue(r.due);
    return `<article class="anim-rise bg-white dark:bg-ink-900 rounded-2xl border border-amber-200 dark:border-amber-500/30 p-4 mb-3" style="animation-delay:${i*40}ms">
      <div class="flex items-center gap-2 mb-2">
        <span class="badge-from text-[10px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded-md text-indigo-700 dark:text-indigo-200">From ${esc(r.fromContact && r.fromContact.name)}</span>
        <span class="text-xs text-slate-500">${f.dayLabel} · ${f.t}</span>
      </div>
      <h3 class="font-bold text-lg">${esc(r.title)}</h3>
      ${r.notes?`<p class="text-sm text-slate-600 dark:text-slate-300 mt-1">${esc(r.notes)}</p>`:''}
      <div class="mt-4 flex gap-2">
        <button onclick="approveRem('${r.id}')" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-semibold">Approve</button>

  }).join('');
}

function renderContacts() {
  const active = state.contacts.filter(c => c.status==='approved');
  const others = state.contacts.filter(c => c.status!=='approved');

    </div>
    ${state.settings.suspended ? `<div class="p-3 rounded-2xl bg-rose-50 dark:bg-rose-500/10 text-rose-700 dark:text-rose-300 text-sm font-medium">Workspace auto-suspended after repeated failed invite attempts. Generate a fresh code after cooldown, or clear in Settings.</div>`:''}
    <div>

    </div>
    ${invites.length? `<div><h3 class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Open invite codes</h3>${invites.map(inv => `
      <div class="bg-white dark:bg-ink-900 rounded-2xl border border-dashed border-indigo-300 dark:border-indigo-500/40 p-4 mb-2 flex items-center gap-3">
        <div class="font-mono text-lg font-extrabold tracking-widest text-indigo-600">${esc(inv.display)}</div>
        <div class="text-xs text-slate-500">Expires ${new Date(inv.expires).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})} · single use</div>
        <button onclick="revokeInvite('${inv.id}')" class="ml-auto text-xs font-semibold text-rose-500">Revoke</button>

function renderAudit() {

function renderInsights() {
  const completed = state.reminders.filter(r => r.completed && r.completedAt);
  const delays = completed.map(r => (new Date(r.completedAt) - new Date(r.due))/60000);
  const avg = delays.length ? Math.round(delays.reduce((a,b)=>a+b,0)/delays.length) : 0;
  const rec = state.reminders.filter(r => r.recurrence);
  const adaptive = rec.filter(r => r.recurrence && r.recurrence.adaptive==='completion').length;
  const hours = completed.map(r => new Date(r.completedAt).getHours());
  const hist = Array(24).fill(0); hours.forEach(h => hist[h]++);
  const max = Math.max(1, ...hist);
  const peak = hist.indexOf(Math.max(...hist));
  return `<div class="grid md:grid-cols-3 gap-3 mb-6">
    <div class="rounded-2xl bg-white dark:bg-ink-900 border border-slate-200/80 dark:border-white/5 p-4">
      <div class="text-xs font-bold uppercase tracking-widest text-slate-400">Avg. completion delta</div>
      <div class="text-3xl font-extrabold mt-1">${avg>0?'+':''}${avg}<span class="text-base font-semibold text-slate-400"> min</span></div>
      <p class="text-xs text-slate-500 mt-1">Positive means you usually finish after the due time. Adaptive recurrence can follow you.</p>
    </div>
    <div class="rounded-2xl bg-white dark:bg-ink-900 border border-slate-200/80 dark:border-white/5 p-4">
      <div class="text-xs font-bold uppercase tracking-widest text-slate-400">Peak completion hour</div>
      <div class="text-3xl font-extrabold mt-1">${completed.length? formatHour(peak): '—'}</div>
      <p class="text-xs text-slate-500 mt-1">Future reminders in this window are slightly more likely to stick.</p>
    </div>
    <div class="rounded-2xl bg-white dark:bg-ink-900 border border-slate-200/80 dark:border-white/5 p-4">
      <div class="text-xs font-bold uppercase tracking-widest text-slate-400">Adaptive series</div>
      <div class="text-3xl font-extrabold mt-1">${adaptive}<span class="text-base font-semibold text-slate-400"> / ${rec.length}</span></div>
      <p class="text-xs text-slate-500 mt-1">Next occurrence based on completion date, not the original clock.</p>
    </div>
  </div>
  <div class="rounded-2xl bg-white dark:bg-ink-900 border border-slate-200/80 dark:border-white/5 p-5">
    <h3 class="font-bold mb-3">When you actually finish</h3>
    <div class="flex items-end gap-1 h-28">${hist.map((v,i)=>`<div class="flex-1 bg-indigo-500/80 rounded-t" style="height:${(v/max)*100}%" title="${formatHour(i)} · ${v}"></div>`).join('')}</div>
    <div class="flex justify-between text-[10px] text-slate-400 mt-1"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>11p</span></div>
  </div>
  <p class="text-xs text-slate-500 mt-4 pb-10">Yere does not train on content of notes. Pattern learning is on-device: completion timestamps only.</p>`;
}

function setDefaultTime(v){
  const [h,m] = v.split(':').map(Number);
  state.settings.defaultHour=h; state.settings.defaultMin=m; persist();
}

/* ---------- Cards / modal ---------- */
function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function prettyUrl(u){ try { const x=new URL(u); return x.hostname.replace(/^www\./,'')+x.pathname.replace(/\/$/,''); } catch(e){ return u; } }

function openConfirmFromInput() {
  const val = document.getElementById('quickInput').value.trim();
  if (!val) { document.getElementById('quickInput').focus(); return; }
  const parsed = parseNaturalLanguage(val);
  draft = {
    id: null,
    title: parsed.title,
    notes: '',
    link: '',
    due: combineDateTime(parsed.date, parsed.time).toISOString(),
    recurrence: parsed.recurrence,
    fromContact: null,
    approved: true,
    parsed
  };
  showConfirmModal();
}

  const chips = (r.parsed && r.parsed.consumed || []).map(c => `<span class="nl-chip px-2 py-0.5 rounded-lg bg-indigo-50 dark:bg-indigo-500/10 text-indigo-700 dark:text-indigo-300 text-[11px] font-semibold">${esc(c.match)}</span>`).join('');
  document.getElementById('modalCard').innerHTML = `
    <div class="p-5 md:p-6">
      <div class="flex items-start justify-between gap-3 mb-4">
        <div>
          <div class="text-[11px] font-bold uppercase tracking-widest text-indigo-500">Confirm capture</div>
          <h2 class="text-xl font-extrabold mt-0.5">Does this look right?</h2>
        </div>
        <button onclick="closeModal()" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-ink-800">✕</button>
      </div>
      ${chips?`<div class="flex flex-wrap gap-1.5 mb-3">${chips}</div>`:''}
      <label class="block text-xs font-semibold text-slate-500 mb-1">Title</label>

          <label class="block text-xs font-semibold text-slate-500 mb-1">Time <span class="font-normal text-slate-400">(defaults 9:00 AM)</span></label>

        </div>

      <label class="block text-xs font-semibold text-slate-500 mb-1">Link</label>
      <input id="dLink" value="${esc(r.link||'')}" placeholder="https://" class="w-full mb-4 rounded-xl bg-slate-100 dark:bg-ink-800 px-3 py-2.5 outline-none">

        <button onclick="closeModal()" class="px-4 py-3 rounded-2xl bg-slate-100 dark:bg-ink-800 font-semibold">Cancel</button>
      </div>
    </div>`;
  openModal();
}

function recurrenceEditor(rec) {
  rec = rec || { type:'none' };
  const type = rec.type || 'none';
  const iv = rec.interval || { value:1, unit:'days' };
  const cal = rec.calendar || { pattern:'first-day', n:1, weekday:1 };
  const end = rec.end || { type:'never', count:10, date:'' };
  const adaptive = rec.adaptive || state.settings.adaptiveDefault;
  return `<details class="rounded-2xl border border-slate-200 dark:border-white/10 p-3" ${type!=='none'?'open':''}>
    <summary class="cursor-pointer font-semibold text-sm">Recurrence ${type!=='none'?'<span class="text-indigo-500 font-bold">· '+esc(recLabel(rec))+'</span>':''}</summary>
    <div class="mt-3 space-y-3 text-sm">
      <div class="flex flex-wrap gap-1.5">
        ${['none','daily','weekdays','weekly','monthly','yearly','custom'].map(p => `<button type="button" onclick="applyPreset('${p}')" class="px-2.5 py-1 rounded-lg text-xs font-semibold ${presetActive(type,rec,p)?'bg-indigo-600 text-white':'bg-slate-100 dark:bg-ink-800'}">${p}</button>`).join('')}
      </div>
      <div id="recCustom" class="${type==='none'?'hidden':''} space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <label>Every
            <input id="rVal" type="number" min="1" value="${iv.value}" class="w-full mt-1 rounded-xl bg-slate-100 dark:bg-ink-800 px-3 py-2">
          </label>
          <label>Unit
            <select id="rUnit" class="w-full mt-1 rounded-xl bg-slate-100 dark:bg-ink-800 px-3 py-2">
              ${['minutes','hours','days','weeks','months','years'].map(u=>`<option ${iv.unit===u?'selected':''}>${u}</option>`).join('')}
            </select>
          </label>
        </div>
        <label class="block">Calendar-aware pattern
          <select id="rCal" class="w-full mt-1 rounded-xl bg-slate-100 dark:bg-ink-800 px-3 py-2">
            <option value="">Use interval above</option>
            <option value="first-day" ${type==='calendar'&&cal.pattern==='first-day'?'selected':''}>First day of month</option>
            <option value="last-day" ${type==='calendar'&&cal.pattern==='last-day'?'selected':''}>Last day of month</option>
            <option value="nth-day" ${type==='calendar'&&cal.pattern==='nth-day'?'selected':''}>Nth day of month</option>
            <option value="nth-weekday" ${type==='calendar'&&cal.pattern==='nth-weekday'?'selected':''}>Nth weekday of month</option>
          </select>
        </label>
        <div class="grid grid-cols-2 gap-2">
          <label>N
            <input id="rN" type="number" value="${cal.n||1}" class="w-full mt-1 rounded-xl bg-slate-100 dark:bg-ink-800 px-3 py-2">
          </label>
          <label>Weekday
            <select id="rWd" class="w-full mt-1 rounded-xl bg-slate-100 dark:bg-ink-800 px-3 py-2">
              ${WEEKDAYS.map((w,i)=>`<option value="${i}" ${(cal.weekday??1)===i?'selected':''}>${w}</option>`).join('')}
            </select>
          </label>
        </div>
        <div>
          <div class="text-xs font-semibold text-slate-500 mb-1">Ends</div>
          <select id="rEnd" class="w-full rounded-xl bg-slate-100 dark:bg-ink-800 px-3 py-2">
            <option value="never" ${end.type==='never'?'selected':''}>Never</option>
            <option value="after" ${end.type==='after'?'selected':''}>After N occurrences</option>
            <option value="on" ${end.type==='on'?'selected':''}>On date</option>
          </select>
          <div class="grid grid-cols-2 gap-2 mt-2">
            <input id="rEndN" type="number" min="1" value="${end.count||10}" class="rounded-xl bg-slate-100 dark:bg-ink-800 px-3 py-2">
            <input id="rEndD" type="date" value="${end.date? end.date.slice(0,10):''}" class="rounded-xl bg-slate-100 dark:bg-ink-800 px-3 py-2">
          </div>
        </div>
        <label class="flex items-center gap-2"><input id="rSkipW" type="checkbox" ${rec.skipWeekends?'checked':''}> Skip weekends</label>
        <label class="flex items-center gap-2"><input id="rSkipH" type="checkbox" ${rec.skipHolidays?'checked':''}> Skip holidays</label>
        <div>
          <div class="text-xs font-semibold text-slate-500 mb-1">Next occurrence based on</div>
          <label class="flex items-center gap-2"><input type="radio" name="adapt" value="original" ${adaptive==='original'?'checked':''}> Original due date</label>
          <label class="flex items-center gap-2"><input type="radio" name="adapt" value="completion" ${adaptive==='completion'?'checked':''}> Completion date (adaptive)</label>
        </div>
      </div>
    </div>
  </details>`;
}

function presetActive(type, rec, p) {
  if (p==='none') return type==='none'||!type;
  if (p==='daily') return type==='interval' && rec.interval && rec.interval.unit==='days' && rec.interval.value===1 && !rec.skipWeekends;
  if (p==='weekdays') return rec.skipWeekends && type==='interval' && rec.interval && rec.interval.unit==='days';
  if (p==='weekly') return type==='interval' && rec.interval && rec.interval.unit==='weeks';
  if (p==='monthly') return (type==='interval' && rec.interval && rec.interval.unit==='months') || type==='calendar';
  if (p==='yearly') return type==='interval' && rec.interval && rec.interval.unit==='years';
  return false;
}

function applyPreset(p) {
  if (!draft) return;
  const base = { end:{type:'never'}, adaptive: state.settings.adaptiveDefault, skipWeekends:state.settings.skipWeekendsDefault, skipHolidays:state.settings.skipHolidaysDefault, completedCount:0 };
  if (p==='none') draft.recurrence = null;
  else if (p==='daily') draft.recurrence = { type:'interval', interval:{value:1,unit:'days'}, ...base };
  else if (p==='weekdays') draft.recurrence = { type:'interval', interval:{value:1,unit:'days'}, ...base, skipWeekends:true };
  else if (p==='weekly') draft.recurrence = { type:'interval', interval:{value:1,unit:'weeks'}, ...base };
  else if (p==='monthly') draft.recurrence = { type:'interval', interval:{value:1,unit:'months'}, ...base };
  else if (p==='yearly') draft.recurrence = { type:'interval', interval:{value:1,unit:'years'}, ...base };
  else draft.recurrence = { type:'interval', interval:{value:1,unit:'days'}, ...base };
  collectDraftFields();
  showConfirmModal();
}

function collectDraftFields() {
  const t = document.getElementById('dTitle');
  if (!t || !draft) return;
  draft.title = t.value.trim() || draft.title;
  draft.notes = document.getElementById('dNotes').value;
  draft.link = document.getElementById('dLink').value.trim();
  const date = document.getElementById('dDate').value;
  const time = document.getElementById('dTime').value || '09:00';
  draft.due = new Date(date+'T'+time+':00').toISOString();
  const rCal = document.getElementById('rCal');
  const rVal = document.getElementById('rVal');
  if (rVal) {
    const endType = document.getElementById('rEnd').value;
    const adapt = (document.querySelector('input[name="adapt"]:checked')||{}).value || 'original';
    const skipW = document.getElementById('rSkipW').checked;
    const skipH = document.getElementById('rSkipH').checked;
    if (rCal && rCal.value) {
      draft.recurrence = {
        type:'calendar',
        calendar: { pattern:rCal.value, n:+document.getElementById('rN').value||1, weekday:+document.getElementById('rWd').value },
        end: { type:endType, count:+document.getElementById('rEndN').value||10, date: document.getElementById('rEndD').value? new Date(document.getElementById('rEndD').value+'T23:59:00').toISOString(): null },
        adaptive: adapt, skipWeekends: skipW, skipHolidays: skipH, completedCount: (draft.recurrence&&draft.recurrence.completedCount)||0
      };
    } else if (draft.recurrence && draft.recurrence.type!=='none') {
      draft.recurrence = {
        type:'interval',
        interval: { value:+rVal.value||1, unit: document.getElementById('rUnit').value },
        weekday: draft.recurrence.weekday,
        end: { type:endType, count:+document.getElementById('rEndN').value||10, date: document.getElementById('rEndD').value? new Date(document.getElementById('rEndD').value+'T23:59:00').toISOString(): null },
        adaptive: adapt, skipWeekends: skipW, skipHolidays: skipH, completedCount: (draft.recurrence&&draft.recurrence.completedCount)||0
      };
    }
  }
}

function saveDraft() {
  collectDraftFields();
  if (!draft.title) { toast('Give it a title'); return; }
  if (editingId) {
    const i = state.reminders.findIndex(r => r.id===editingId);
    if (i>=0) {
      const prev = state.reminders[i];
      state.reminders[i] = { ...prev, title:draft.title, notes:draft.notes, link:draft.link, due:draft.due, recurrence:draft.recurrence, updatedAt: now().toISOString() };
      logAudit('You', 'edited reminder', draft.title);
    }
    editingId = null;
    toast('Reminder updated');
  } else {
    state.reminders.unshift({
      id: uid(), title: draft.title, notes: draft.notes, link: draft.link, due: draft.due,
      recurrence: draft.recurrence, completed:false, createdAt: now().toISOString(),
      fromContact: draft.fromContact, approved: true
    });
    logAudit('You', 'created reminder', draft.title);
    toast('Saved · '+ formatDue(draft.due).dayLabel + ' ' + formatDue(draft.due).t);
  }
  document.getElementById('quickInput').value='';
  document.getElementById('livePreview').classList.add('hidden');
  persist(); closeModal(); render();
}

function editReminder(id) {
  const r = state.reminders.find(x => x.id===id);
  if (!r) return;
  editingId = id;
  draft = clone(r);
  draft.parsed = { consumed: [] };
  showConfirmModal();
}

function deleteReminder(id) {
  const r = state.reminders.find(x=>x.id===id);
  state.reminders = state.reminders.filter(x => x.id!==id);
  logAudit('You', 'deleted reminder', r? r.title : id);
  persist(); closeModal(); render(); toast('Deleted');
}

function toggleComplete(id) {
  const r = state.reminders.find(x => x.id===id);
  if (!r) return;
  if (!r.completed) {
    r.completed = true;
    r.completedAt = now().toISOString();
    if (r.recurrence && r.recurrence.type && r.recurrence.type!=='none') {
      const next = nextOccurrence(r, now(), true);
      r.recurrence.completedCount = (r.recurrence.completedCount||0)+1;
      if (next) {
        const series = clone(r);
        series.id = uid();
        series.completed = false;
        series.completedAt = null;
        series.due = next.toISOString();
        series.createdAt = now().toISOString();
        state.reminders.unshift(series);
        toast('Completed · next ' + formatDue(next.toISOString()).dayLabel + ' ' + formatDue(next.toISOString()).t);
      } else toast('Series finished');
    } else toast('Completed');
  } else {
    r.completed = false; r.completedAt = null;
  }
  persist(); render();
}

function skipOnce(id) {
  const r = state.reminders.find(x => x.id===id);
  if (!r || !r.recurrence) return;
  const next = nextOccurrence({ ...r, completedAt: now().toISOString(), recurrence:{...r.recurrence, adaptive:'original'} }, now(), false);
  if (next) { r.due = next.toISOString(); toast('Skipped · next '+formatDue(r.due).dayLabel); }
  persist(); closeModal(); render();
}

function snooze(id, mins) {
  const r = state.reminders.find(x => x.id===id);
  if (!r) return;
  const d = new Date(); d.setMinutes(d.getMinutes()+mins);
  r.due = d.toISOString(); r.completed=false;
  persist(); closeModal(); render(); toast('Snoozed 1 hour');
}

function approveRem(id) {
  const r = state.reminders.find(x=>x.id===id);
  if (!r) return;
  r.approved = true; r.requiresApproval=false;
  logAudit('You', 'approved reminder', r.title + ' from ' + (r.fromContact&&r.fromContact.name));
  persist(); render(); toast('Approved');
}
function rejectRem(id) {
  const r = state.reminders.find(x=>x.id===id);
  if (!r) return;
  r.rejected = true; r.requiresApproval=false;
  logAudit('You', 'declined reminder', r.title);
  persist(); render(); toast('Declined');
}

function openInviteModal() {
  if (state.settings.suspended) { toast('Workspace suspended'); return; }
  const hourAgo = Date.now()-3600000;
  state.settings.rate.invites = (state.settings.rate.invites||[]).filter(t => t>hourAgo);
  if (state.settings.rate.invites.length >= 5) { toast('Rate limit: max 5 invites / hour'); return; }
  const raw = makeCode();
  const inv = { id:uid(), display: raw, hash: hashCode(raw.replace('-','')), expires: new Date(Date.now()+24*3600000).toISOString(), used:false, createdAt: now().toISOString() };
  state.invites.unshift(inv);
  state.settings.rate.invites.push(Date.now());
  logAudit('You', 'generated invite code', inv.display + ' · 24h · single-use');
  persist();
  document.getElementById('modalCard').innerHTML = `
    <div class="p-6 text-center">
      <div class="text-[11px] font-bold uppercase tracking-widest text-indigo-500">Single-use · 24 hours</div>
      <h2 class="text-xl font-extrabold mt-1 mb-4">Share this code</h2>
      <div class="font-mono text-3xl font-extrabold tracking-[0.25em] text-indigo-600 py-5 rounded-2xl bg-indigo-50 dark:bg-indigo-500/10">${esc(inv.display)}</div>
      <p class="text-xs text-slate-500 mt-3">Hashed at rest as ${esc(inv.hash.slice(0,12))}… · cannot be reused after redemption.</p>
      <button onclick="navigator.clipboard.writeText('${inv.display}').then(()=>toast('Copied'))" class="mt-5 px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold text-sm">Copy code</button>
      <button onclick="closeModal();setView('contacts')" class="block mx-auto mt-3 text-sm text-slate-500">Done</button>
    </div>`;
  openModal();
  render();
}
function makeCode(){
  const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<8;i++) s+=a[Math.floor(Math.random()*a.length)];
  return s.slice(0,4)+'-'+s.slice(4);
}
function revokeInvite(id){ state.invites = state.invites.map(i => i.id===id?{...i, used:true, revoked:true}:i); logAudit('You','revoked invite', id); persist(); render(); toast('Invite revoked'); }
function revokeContact(id){
  const c = state.contacts.find(x=>x.id===id); if(!c) return;
  c.status='revoked'; logAudit('You','revoked contact', c.name); persist(); render(); toast('Access revoked');
}
function reinstateContact(id){

function simulateInbound() {
  const cid = document.getElementById('simC').value;
  const c = state.contacts.find(x=>x.id===cid);

  const parsed = parseNaturalLanguage(document.getElementById('simT').value || 'Follow up tomorrow');
  const needs = c.mode==='approve' || state.settings.approvalMode==='approve' && c.mode!=='direct';
  const rem = {
    id: uid(), title: parsed.title, notes: document.getElementById('simN').value,
    link:'', due: combineDateTime(parsed.date, parsed.time).toISOString(),
    recurrence: parsed.recurrence, completed:false, createdAt: now().toISOString(),
    fromContact: { id:c.id, name:c.name }, approved: !needs, requiresApproval: needs
  };
  state.reminders.unshift(rem);
  logAudit(c.name, needs?'proposed reminder':'created reminder', rem.title);
  persist(); closeModal(); render();
  toast(needs ? 'Waiting for your approval' : 'Added from '+c.name);
}

/* ---------- Voice ---------- */
function toggleVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Speech recognition not supported in this browser'); return; }
  if (listening) { try{ recognition.stop(); }catch(e){} listening=false; setMicUI(false); return; }
  recognition = new SR();
  recognition.lang = navigator.language || 'en-US';
  recognition.interimResults = true;
  recognition.continuous = false;
  recognition.onresult = (ev) => {
    let final='', interim='';
    for (let i=ev.resultIndex; i<ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) final += t; else interim += t;
    }
    document.getElementById('quickInput').value = (final || interim).trim();
    autoGrow(document.getElementById('quickInput'));
    liveParse();
    if (final) { listening=false; setMicUI(false); openConfirmFromInput(); }
  };
  recognition.onerror = () => { listening=false; setMicUI(false); toast('Mic error or permission denied'); };
  recognition.onend = () => { listening=false; setMicUI(false); };
  try { recognition.start(); listening=true; setMicUI(true); } catch(e){ toast('Could not start microphone'); }
}
function setMicUI(on) {
  document.getElementById('micBtn').classList.toggle('listening', on);
  document.getElementById('micBtn').classList.toggle('bg-rose-500', on);
  document.getElementById('micBtn').classList.toggle('text-white', on);
  document.getElementById('micIcon').classList.toggle('hidden', on);
  document.getElementById('micWave').classList.toggle('hidden', !on);
}

/* ---------- Live parse chips ---------- */
function liveParse() {
  const v = document.getElementById('quickInput').value.trim();
  const box = document.getElementById('livePreview');
  if (!v) { box.classList.add('hidden'); return; }
  const p = parseNaturalLanguage(v);
  const due = combineDateTime(p.date, p.time);
  const f = formatDue(due.toISOString());
  const rec = recLabel(p.recurrence);
  box.classList.remove('hidden');
  box.querySelector('div').innerHTML = `
    <span class="px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-ink-800 text-slate-600 dark:text-slate-300 font-medium">${esc(p.title)}</span>
    <span class="px-2 py-0.5 rounded-lg bg-indigo-50 dark:bg-indigo-500/10 text-indigo-700 dark:text-indigo-300 font-semibold">${f.dayLabel} · ${f.t}</span>
    ${rec?`<span class="px-2 py-0.5 rounded-lg bg-violet-50 dark:bg-violet-500/10 text-violet-700 dark:text-violet-300 font-semibold">↻ ${esc(rec)}</span>`:''}
  `;
}

function autoGrow(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight, 128)+'px'; }
function onQuickKey(e){ if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); openConfirmFromInput(); } }
function onSearch(q){ searchQ=q; render(); }

function toast(msg) {
  const host = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast-in rounded-2xl bg-ink-900 dark:bg-white text-white dark:text-ink-900 px-4 py-3 text-sm font-semibold shadow-xl';
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

function toggleTheme(){
  const dark = document.documentElement.classList.toggle('dark');
  state.settings.theme = dark?'dark':'light'; persist();
}

function requestNotif(){
  if (!('Notification' in window)) { toast('Notifications not supported'); return; }
  Notification.requestPermission().then(p => {
    state.settings.notif = p==='granted'; persist();
    toast(p==='granted' ? 'Notifications on' : 'Permission '+p);
  });
}

function tickDue() {
  if (!state.settings.notif || Notification.permission!=='granted') return;
  const t = now();
  state.reminders.forEach(r => {
    if (r.completed || r.approved===false || r.notified) return;
    const d = new Date(r.due);
    if (Math.abs(d - t) < 35000 && d <= t) {
      r.notified = true;
      try { new Notification('Yere · '+r.title, { body: (r.notes||'Due now') + (r.fromContact? ' · from '+r.fromContact.name : ''), tag: r.id }); } catch(e){}
    }
  });
  persist();
}

document.addEventListener('keydown', (e) => {
  if (e.key==='Escape') closeModal();
  if ((e.key==='/' ) && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA') {
    e.preventDefault(); document.getElementById('search').focus();
  }
  if ((e.key==='n' || e.key==='N') && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA' && !e.metaKey && !e.ctrlKey) {
    document.getElementById('quickInput').focus();
  }
});

/* boot */
load();
document.getElementById('meName').textContent = state.user.name;
render();
dueTimer = setInterval(tickDue, 15000);
</script>
</body>
</html>
