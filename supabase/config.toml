project_id = "yere"

[api]
enabled = true
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[studio]
enabled = true

[auth]
enabled = true
# The canonical production origin. Supabase -> Authentication -> URL Configuration holds the
# hosted project's real value; this file drives `supabase start` locally and is kept identical so
# confirmation and reset links behave the same in development.
site_url = "https://getyere.com"
# Both canonical hosts are listed so neither the apex domain used by the Vercel redirect nor the
# www host verified for app links breaks a sign-in, and yere://** keeps the native deep link working.
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
  "https://www.getyere.com/**",
  "https://getyere.com/**",
  "https://getyere.vercel.app/**",
  "https://*.vercel.app/**",
  "yere://**",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.sms]
enable_signup = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

